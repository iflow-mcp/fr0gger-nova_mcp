[project]
name = "iflow-mcp_fr0gger-nova_mcp"
version = "0.1.1"
description = "NOVA MCP Security Gateway - validates prompts against security rules"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mcp",
    "python-dotenv",
    "nova-hunting",
    "openai"
]

[project.scripts]
nova-mcp = "nova_mcp_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["nova_mcp_server"]

[tool.setuptools.package-data]
"*" = ["*.nov"]